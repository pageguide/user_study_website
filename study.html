<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageGuide Find V2 — check the claim</title>
  <link rel="stylesheet" href="styles/stimulus.css">
  <link rel="stylesheet" href="styles/site.css?v=find-v2-20260915">
</head>
<body>
  <div class="task-shell">
    <!-- No task header here: V2 gives the whole left pane to the page, and the question and the
         Grounded/Non-grounded chip live in the question pane on the right. See renderFindTask. -->
    <section class="task-stimulus" id="stimulus-pane">
      <main class="tv-main">
        <section class="tv-stage" id="tv-stage">
          <div class="tv-empty">Loading the saved page…</div>
        </section>
      </main>
    </section>
    <aside class="task-panel" id="question-pane">
      <div class="q-loading">Loading Find V2…</div>
    </aside>
  </div>

  <script>window.STUDY_VARIANT = 'find-v2';</script>
  <script src="app/find_v2_config.js?v=find-v2-20260915" onerror="window.__findV2ConfigMissing = true"></script>
  <script src="app/markdown.js?v=find-v2-20260915"></script>
  <!-- Citation markers: one tolerant reader for the player and the editor. -->
  <script src="app/find_citations.js?v=find-v2-20260915"></script>
  <!-- The four-variant model is shared by the adapter, the session and the editor. -->
  <script src="app/find_v2_variants.js?v=find-v2-20260915"></script>
  <script src="app/find_v2_supabase.js?v=find-v2-20260915"></script>
  <script src="app/find_v2_session.js?v=find-v2-20260915"></script>
  <script src="app/find_task.js?v=find-v2-20260915"></script>
  <script src="app/stimulus.js?v=find-v2-20260915"></script>
  <script src="app/instrument.js?v=find-v2-20260915"></script>
  <script src="app/study.js?v=find-v2-20260915"></script>
</body>
</html>
