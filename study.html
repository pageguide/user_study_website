<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageGuide Find V2 — check the claim</title>
  <link rel="stylesheet" href="styles/stimulus.css?v=find-v2-20260902o">
  <link rel="stylesheet" href="styles/site.css?v=find-v2-20260903b">
</head>
<body>
  <div class="task-shell">
    <!-- No task header here: V2 gives the whole left pane to the page, and the question and the
         Grounded/Non-grounded chip live in the question pane on the right. See renderFindTask. -->
    <section class="task-stimulus" id="stimulus-pane">
      <main class="tv-main">
        <section class="tv-stage" id="tv-stage">
          <div class="tv-empty">Loading the saved page…</div>
        </section>
      </main>
    </section>
    <aside class="task-panel" id="question-pane">
      <div class="q-loading">Loading Find V2…</div>
    </aside>
  </div>

  <script>window.STUDY_VARIANT = 'find-v2';</script>
  <script src="app/find_v2_config.js?v=find-v2-20260902o" onerror="window.__findV2ConfigMissing = true"></script>
  <script src="app/markdown.js?v=find-v2-20260902o"></script>
  <!-- Citation markers: one tolerant reader for the player and the editor. -->
  <script src="app/find_citations.js?v=find-v2-20260902o"></script>
  <!-- The four-variant model is shared by the adapter, the session and the editor. -->
  <script src="app/find_v2_variants.js?v=find-v2-20260902o"></script>
  <script src="app/find_v2_guide_key.js?v=find-v2-20260902o"></script>
  <script src="app/find_v2_supabase.js?v=find-v2-20260902o"></script>
  <script src="app/find_v2_session.js?v=find-v2-20260903c"></script>
  <script src="app/find_task.js?v=find-v2-20260902o"></script>
  <!-- THE NON-GROUNDED ARM'S DEFINITION. _stripGuideArm lives here, and without it a task whose
       `arms.nongrounding` was never recorded renders as "no trajectory recorded for this condition"
       — which is not the condition, it is a blank page where the condition should be. With it, the
       non-grounded arm is DERIVED from the grounded one: same steps as text, no screenshots, no
       evidence. Verbatim copy of the extension's file; see the rule in README. -->
  <script src="vendor/guide_trajectories.js?v=find-v2-20260902o"></script>
  <script src="app/stimulus.js?v=find-v2-20260903b"></script>
  <script src="app/instrument.js?v=find-v2-20260902o"></script>
  <!-- THE WALKTHROUGH, and the drawn screenshots its practice trajectory is built from. Loaded
       before study.js because boot() offers it on task 1, so window.Tutorial has to exist by then.
       The practice material is invented and its results are never written; see the file header. -->
  <script src="app/fake_page.js?v=find-v2-20260902o"></script>
  <script src="app/find_v2_tutorial_fixtures.js?v=find-v2-20260903a"></script>
  <script src="app/find_v2_tutorial.js?v=find-v2-20260903c"></script>
  <script src="app/study.js?v=find-v2-20260903c"></script>
</body>
</html>
